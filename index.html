<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NexWatch – Movies, TV & Manga Tracker</title>
    <meta name="description" content="Track movies, TV shows, manga and webtoons in one place. Discover trending titles, build your personal watchlist, and track your progress." />

    <!-- ── PWA / Install ── -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#7c5cfc" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ── iOS / Safari ── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NexWatch" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />

    <!-- ── Favicon ── -->
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />

    <!-- ── Fonts ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <div id="loading-screen">
        <div class="loader-logo">NexWatch</div>
        <div class="loader-spinner"></div>
      </div>
    </div>

    <!-- Service Worker registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope: './' })
            .then(reg => console.info('[NexWatch] SW registered, scope:', reg.scope))
            .catch(err => console.warn('[NexWatch] SW registration failed:', err));
        });
      }
    </script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
